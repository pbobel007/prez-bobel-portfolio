services:
  - type: web
    name: prez-bobel
    runtime: node
    plan: free
    rootDir: portfolio
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/locales
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
